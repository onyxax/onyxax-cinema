<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16181f"/>
      <stop offset="55%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4f5c"/>
      <stop offset="45%" stop-color="#24262e"/>
      <stop offset="100%" stop-color="#101117"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8d98e"/>
      <stop offset="55%" stop-color="#e3a83c"/>
      <stop offset="100%" stop-color="#c98a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e3a83c" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#e3a83c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#e3a83c" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="gemClip">
      <path d="M321.1 98.9 L413.1 190.9 L413.1 321.1 L321.1 413.1 L190.9 413.1 L98.9 321.1 L98.9 190.9 L190.9 98.9 Z"/>
    </clipPath>
  </defs>

  <!-- Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Top shine -->
  <path d="M0 0h512v240a112 112 0 0 1-112 112h-96L0 112z" fill="#ffffff" fill-opacity="0.035"/>

  <!-- Center glow -->
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- Outer hairline ring -->
  <circle cx="256" cy="256" r="202" fill="none" stroke="#e3a83c" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- Onyx gemstone -->
  <g filter="url(#softShadow)">
    <path d="M321.1 98.9 L413.1 190.9 L413.1 321.1 L321.1 413.1 L190.9 413.1 L98.9 321.1 L98.9 190.9 L190.9 98.9 Z"
          fill="url(#gem)" stroke="#e3a83c" stroke-opacity="0.28" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Onyx banding -->
    <g clip-path="url(#gemClip)" fill="#ffffff">
      <rect x="170" y="232" width="172" height="30" rx="15" fill-opacity="0.05" transform="rotate(45 256 256)"/>
      <rect x="196" y="214" width="120" height="18" rx="9" fill-opacity="0.04" transform="rotate(45 256 256)"/>
    </g>
    <!-- Facet highlight -->
    <path d="M321.1 98.9 L413.1 190.9 L413.1 321.1 L321.1 413.1 L413.1 321.1 L413.1 190.9 Z"
          fill="#ffffff" fill-opacity="0.02" clip-path="url(#gemClip)"/>
  </g>

  <!-- Play button -->
  <path d="M196 174 V338 L332 256 Z" fill="url(#gold)" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round" filter="url(#softShadow)"/>
  <path d="M208 188 L208 302 L292 256 Z" fill="#ffffff" fill-opacity="0.14"/>
  <path d="M204 182 L196 174 V338 L204 330 Z" fill="#ffffff" fill-opacity="0.25"/>
</svg>
