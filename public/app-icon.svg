<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a34"/>
      <stop offset="50%" stop-color="#22221e"/>
      <stop offset="100%" stop-color="#121210"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#d97757" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="playGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f09a7a"/>
      <stop offset="100%" stop-color="#d0653f"/>
    </linearGradient>
    <filter id="playShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#d97757" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle shine overlay -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" opacity="0"/>
  <path d="M0 0h512v256a256 256 0 0 0-512 0z" fill="#ffffff" fill-opacity="0.03"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#d97757" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#d97757" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Subtle film frame corners -->
  <g fill="none" stroke="#d97757" stroke-opacity="0.08" stroke-width="2.5">
    <rect x="234" y="56" width="44" height="10" rx="3"/>
    <rect x="234" y="446" width="44" height="10" rx="3"/>
    <rect x="56" y="234" width="10" height="44" rx="3"/>
    <rect x="446" y="234" width="10" height="44" rx="3"/>
  </g>

  <!-- Glow behind play button -->
  <circle cx="256" cy="256" r="140" fill="url(#glow)"/>

  <!-- Inner ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#d97757" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Play button shadow -->
  <path d="M196 172v168l144-84z" fill="#000" fill-opacity="0.25" filter="url(#playShadow)"/>

  <!-- Play button -->
  <path d="M196 172v168l144-84z" fill="url(#playGrad)" stroke="url(#playGrad)" stroke-width="10" stroke-linejoin="round"/>

  <!-- Highlight reflection on play button -->
  <path d="M208 180l-2 2v148l120-70z" fill="#ffffff" fill-opacity="0.1" stroke-linejoin="round"/>

  <!-- Small sparkle dots -->
  <g fill="#d97757" fill-opacity="0.12">
    <circle cx="130" cy="140" r="4"/>
    <circle cx="390" cy="380" r="3.5"/>
    <circle cx="400" cy="140" r="3"/>
    <circle cx="120" cy="370" r="2.5"/>
  </g>
</svg>
